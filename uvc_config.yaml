# Configure each UVC's parameters here

- uvc: some_uvc
  rst_is_negedge_sensitive: true
  clock_name: clock
  reset_name: nreset

  use_short_names: false
  agent_has_coverage: true
  gen_tdefs_pkg: false
  vif_in_config: false
  
  tr_props_vec:
    - field_name: data_to_send
      type: bit
      range: "[7:0]"
      is_rand: true
    - field_name: data_received
      type: bit
      range: "[7:0]"
      is_rand: false
  
  if_sigs_vec:
    - field_name: ready_o
      type: logic
      range: ""
      is_output: true
    - field_name: valid_i
      type: logic
      range: ""
      is_output: false
    - field_name: data_o
      type: logic
      range: "[7:0]"
      is_output: true
    - field_name: data_i
      type: logic
      range: "[7:0]"
      is_output: false
  
  uvc_has_params: true
  use_env_params: false
  params_vec:
    - type: int
      name: PARAM1
      default_val: "100"
    - type: bit [7:0]
      name: PARAM2
      default_val: 8'hAB



- uvc: another_uvc
  rst_is_negedge_sensitive: true
  clock_name: clk
  reset_name: rst_n

  use_short_names: true
  agent_has_coverage: false
  gen_tdefs_pkg: true
  vif_in_config: true
  
  tr_props_vec:
    - field_name: random_data
      type: logic
      range: "[15:0]"
      is_rand: true
    - field_name: data_received
      type: bit
      range: "[7:0]"
      is_rand: false
  
  if_sigs_vec:
    - field_name: another_ready_o
      type: logic
      range: ""
      is_output: true
    - field_name: another_valid_i
      type: logic
      range: ""
      is_output: false
    - field_name: another_data_o
      type: logic
      range: "[7:0]"
      is_output: true
    - field_name: another_data_i
      type: logic
      range: "[7:0]"
      is_output: false
  
  class_names:
    agent: agt
    transaction: seq_item
    config: conf
  
  uvc_has_params: true
  use_env_params: true
  params_vec:
    - type: int
      name: PARAM1
      default_val: "100"
    - type: bit [7:0]
      name: PARAM2
      default_val: 8'hAB



